# Sysbuild configuration for the STS1000 "Meridian".
# SPDX-License-Identifier: Apache-2.0
#
# Boot chain: STiRoT (ROM, OBK-configured) -> MCUboot -> slot0 application.
# ARCHITECTURE.md §3.

SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Two-slot A/B with revert. Swap-using-move needs no scratch partition; both
# slots are 896 KB = 112 x 8 KB sectors.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y

# ECDSA P-256 + SHA-256. The key path itself is defaulted in Kconfig.sysbuild
# (it has to be absolute, and .conf fragments cannot expand $(APP_DIR)).
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# Images are not encrypted: the update path is a local serial link, and the
# STiRoT-anchored signature chain is what establishes authenticity.
SB_CONFIG_BOOT_ENCRYPTION=n
