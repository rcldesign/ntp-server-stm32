# MCUboot image configuration for the STS1000 "Meridian".
# SPDX-License-Identifier: Apache-2.0
#
# Budget: boot_partition is 128 KB (ARCHITECTURE.md §3). Everything below that
# is not strictly required for "verify slot0, or accept a signed image over the
# USB console" is turned off.

# ---------------------------------------------------------------------------
# Serial recovery over USB CDC-ACM (ARCHITECTURE.md §3 upgrade path 2).
# Entry is by held button only: BUTTON_1 (PF0), the `mcuboot-button0` alias.
# There is deliberately no BOOT_SERIAL_WAIT_FOR_DFU — a grandmaster must not
# add a fixed delay to every boot.
# ---------------------------------------------------------------------------
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=y
# Hold BUTTON_1 for 1 s to enter recovery; a transient press is ignored.
CONFIG_BOOT_SERIAL_DETECT_DELAY=1000
CONFIG_BOOT_ERASE_PROGRESSIVELY=y

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_MANUFACTURER="RCL Design"
CONFIG_USB_DEVICE_PRODUCT="STS1000 Meridian recovery"
# Distinct PID so a host can tell the recovery enumeration from the application.
CONFIG_USB_DEVICE_PID=0x1001

# Slot geometry is 896 KB / 8 KB sectors = 112 sectors per slot. MCUboot's
# BOOT_MAX_IMG_SECTORS_AUTO derives that from the partition table in devicetree,
# so it is deliberately NOT pinned here — a hand-set value would go stale the
# moment the partition map changes and Kconfig would reject it anyway.

# ---------------------------------------------------------------------------
# Anti-rollback (spec §8.2/§15, root CLAUDE.md "Memory & boot").
#
# Without this a correctly-signed OLDER image installs over a newer one, so a
# withdrawn build with a known vulnerability is a valid update forever. The
# signature chain says "we built this", not "this is still fit to run"; the
# security counter is what says the second thing.
#
# WHY THE SECURITY-COUNTER VARIANT AND NOT PLAIN SW MODE
# -----------------------------------------------------
# Plain MCUBOOT_DOWNGRADE_PREVENTION compares image *versions* and demands a
# greater major, or a greater minor at equal major (loader.c boot_version_cmp()
# — the revision field is not even consulted). 0.1.0 -> 0.1.1 would therefore be
# REJECTED, i.e. no patch release could ever ship. The security-counter variant
# accepts a counter that is greater OR EQUAL, which decouples the rollback gate
# from the version number entirely: routine releases keep the counter, only a
# security-relevant release advances it.
#
# WHAT IT ACTUALLY COMPARES (loader.c check_downgrade_prevention())
# ----------------------------------------------------------------
#   * The IMAGE_TLV_SEC_CNT (0x50) value in the running slot-0 image versus the
#     one in the staged slot-1 image. Both come from the PROTECTED TLV area, so
#     both are covered by the signature — a counter cannot be edited without
#     re-signing.
#   * No NV/OTP counter is involved. That is MCUBOOT_HW_DOWNGRADE_PREVENTION,
#     which is deliberately NOT used here: it needs CONFIG_I2C plus CryptoAuthLib
#     inside a 128 KB bootloader that currently sets CONFIG_I2C=n above, and it
#     would let a wedged I²C bus brick the boot. The ATECC608B monotonic counter
#     is kept as attestation evidence on the application side instead
#     (src/zephyr/console/sts_rollback.c).
#   * It runs for BOOT_SWAP_TYPE_TEST and _PERM only. A REVERT is never gated,
#     so MCUboot can always undo an image that failed to self-confirm even
#     though the image it goes back to has a lower counter.
#
# FIRST BOOT AFTER ENABLING IT IS SAFE
# ------------------------------------
# check_downgrade_prevention() reads slot 0 first and `return 0` (allow) when
# slot 0 carries no counter TLV. Every image built before this change has
# protected_tlv_size == 0, so the first upgrade TO a counter-bearing image is
# permitted. Nothing has to be pre-seeded anywhere; there is no device-side
# state to initialise.
#
# The converse is the standing rule from then on: once a counter-bearing image
# is running, an image signed WITHOUT --security-counter is refused (slot-1 read
# fails -> rc != 0 -> downgrade prevented). See app/conf/rollback.conf for the
# release procedure that keeps that from surprising anyone.
#
# Depends on BOOT_SWAP_USING_MOVE, which is this project's mode
# (app/sysbuild.conf SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE).
# ---------------------------------------------------------------------------
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION_SECURITY_COUNTER=y

# ---------------------------------------------------------------------------
# Size trimming.
#
# The board .dts describes the whole product, so several drivers would default
# to "on" inside the bootloader purely because their devicetree node exists.
# None of them are reachable from MCUboot: the SPI-NOR is not a boot device
# (ARCHITECTURE.md §3: "NOR is not required to boot") and it is still held in
# reset by NOR_RST_N at this point, and the backup SRAM has no bootloader use.
# ---------------------------------------------------------------------------
CONFIG_SPI=n
CONFIG_SPI_NOR=n
CONFIG_STM32_BACKUP_SRAM=n
CONFIG_I2C=n
CONFIG_ADC=n
CONFIG_DAC=n
CONFIG_PWM=n
CONFIG_SENSOR=n
CONFIG_DMA=n

# No console: the CDC-ACM endpoint belongs to the SMP recovery transport, and
# this board has no spare UART for one.
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_BOOT_BANNER=n

# With no console there is nowhere for a log line to go, so compile MCUboot's
# own log strings out. The LOG subsystem itself stays enabled: MCUboot's
# prj.conf hard-assigns LOG_MODE_MINIMAL / LOG_DEFAULT_LEVEL, and turning
# CONFIG_LOG off would leave those assignments unsatisfiable and produce
# Kconfig warnings on every build.
CONFIG_MCUBOOT_LOG_LEVEL_OFF=y
CONFIG_SHELL=n
CONFIG_ASSERT=n
CONFIG_TIMESLICING=n
