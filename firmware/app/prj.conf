# STS1000 "Meridian" application configuration
# SPDX-License-Identifier: Apache-2.0
#
# Wave 1a scope: board bring-up skeleton. Subsystems that later waves need are
# enabled here so that the target build proves they fit and link; the logic that
# uses them lands with the modules in ARCHITECTURE.md §5.

# ---------------------------------------------------------------------------
# Kernel
# ---------------------------------------------------------------------------
CONFIG_STD_C11=y
# ARCHITECTURE.md §6 uses priorities up to 16; the default ceiling is 15.
CONFIG_NUM_PREEMPT_PRIORITIES=20
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_REBOOT=y
CONFIG_HWINFO=y

# ---------------------------------------------------------------------------
# Logging — deferred so no service thread ever blocks on a log backend
# (the console is USB CDC-ACM, whose host may be absent for months).
# ---------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=y
CONFIG_LOG_FUNC_NAME_PREFIX_ERR=y

# ---------------------------------------------------------------------------
# Console / shell on USB CDC-ACM #0 (chosen nodes live in the board .dts).
# ---------------------------------------------------------------------------
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_PROMPT_UART="sts1000:~$ "
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y

# ---------------------------------------------------------------------------
# USB device — composite, 2x CDC-ACM (ARCHITECTURE.md §6).
#   ACM0 shell + log console (human), ACM1 binary MCP channel (PC tool).
# Enumerating at boot keeps the console usable from the first log line; CDC-ACM
# poll_out discards rather than blocks when no host is attached.
#
# TODO(pre-production): CONFIG_USB_DEVICE_VID is left at Zephyr's shared test
# value 0x2FE3 because the project has no USB-IF allocation yet; Zephyr emits a
# CMake warning about that on every build, and it is meant to stay visible until
# a real VID is assigned. The PIDs are set locally so the two enumerations
# (application 0x1000 here, MCUboot recovery 0x1001 in sysbuild/mcuboot.conf)
# are at least distinguishable on a host.
# ---------------------------------------------------------------------------
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_COMPOSITE_DEVICE=y
CONFIG_USB_DEVICE_MANUFACTURER="RCL Design"
CONFIG_USB_DEVICE_PRODUCT="STS1000 Meridian"
CONFIG_USB_DEVICE_PID=0x1000
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y

# ---------------------------------------------------------------------------
# Networking — RMII LAN8742AI, dual stack, DHCPv4.
# NTP/NTS (UDP 123), NTS-KE (TCP) and PTP are application services built on
# sockets; only the transports are enabled here.
# ---------------------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_MAX_CONTEXTS=16

# MAC IEEE-1588 hardware timestamping — the PTP grandmaster's time source.
# The PTP timer is fed from HCLK (250 MHz) on the STM32H5.
CONFIG_PTP_CLOCK=y
CONFIG_PTP_CLOCK_STM32_HAL=y
CONFIG_ETH_STM32_HAL_PTP_CLOCK_SRC_HZ=250000000
CONFIG_NET_PKT_TIMESTAMP=y
# The STM32 HAL TX-PTP callback hands finished frames to net_if_add_tx_timestamp(),
# which only exists when the TX-timestamp thread is built.
CONFIG_NET_PKT_TIMESTAMP_THREAD=y

# ---------------------------------------------------------------------------
# Storage
#   internal flash : NVS-backed settings on storage_partition
#   external NOR   : LittleFS (`/lfs`); mounted by a later wave
# ---------------------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# ---------------------------------------------------------------------------
# DFU — ARCHITECTURE.md §3 upgrade path 1: MCP FW_* commands stream a signed
# image into slot1, then boot_request_upgrade(TEST) + self-confirm.
# ---------------------------------------------------------------------------
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# ---------------------------------------------------------------------------
# Buses and analog
# ---------------------------------------------------------------------------
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_DAC=y
CONFIG_PWM=y
CONFIG_SENSOR=y
CONFIG_ENTROPY_GENERATOR=y

# The external TPS3430 windowed watchdog (WDT_EN/PC12 + WDT_KICK/PB2) is the
# real supervisor; the STM32 IWDG stays off so it cannot pre-empt the
# hardware-OR'd POE_KILL path.
CONFIG_WATCHDOG=n

# TODO(wave-3): PANEL_LED_PWM (PE0) has no timer output channel on
# STM32H563 (the AF table offers only TIM4_ETR there), so panel-LED dimming
# cannot use the PWM driver. It is a plain GPIO in the board .dts; the UI wave
# must implement software dimming (timer ISR or DMA-to-BSRR) with a period well
# under the INA228 0x4C averaging window (interface ref §4.1).
