# STS1000 "Meridian" — network area (Ethernet, NTP/NTS, PTP, SNMP, syslog).
# SPDX-License-Identifier: Apache-2.0
#
# Merged after prj.conf and before console.conf/platform.conf by the glob in
# app/CMakeLists.txt (sorted filename order: net < console < platform, later
# wins). Only symbols this area needs live here; the transports themselves are
# already in prj.conf.

# ---------------------------------------------------------------------------
# Hardware timestamping — the whole reason this is a grandmaster.
#
# prj.conf enables NET_PKT_TIMESTAMP + NET_PKT_TIMESTAMP_THREAD and the STM32
# PTP clock. NET_CONTEXT_TIMESTAMPING is what turns SO_TIMESTAMPING into a
# receive control message and an egress-timestamp request (subsys/net/ip/
# net_context.c). It defaults y under NET_UDP+NET_PKT_TIMESTAMP; set here
# explicitly because the NTP and PTP RX paths are wrong without it.
#
# eth_stm32_hal (API v2) is the only H5 Ethernet driver that carries the PTP
# timestamp unit; PTP_CLOCK_STM32_HAL in prj.conf depends on it.
# ---------------------------------------------------------------------------
CONFIG_NET_CONTEXT_TIMESTAMPING=y
CONFIG_ETH_STM32_HAL_API_V2=y

# ---------------------------------------------------------------------------
# PTP L2 transport (IEEE 1588 Annex E, EtherType 0x88F7). The raw-Ethernet
# transport option needs packet sockets; the UDP transports do not.
# ---------------------------------------------------------------------------
CONFIG_NET_SOCKETS_PACKET=y

# ---------------------------------------------------------------------------
# Multicast — PTP joins 224.0.1.129 / ff0e::181; IGMP/MLD carry the joins.
# ---------------------------------------------------------------------------
CONFIG_NET_IPV4_IGMP=y

# ---------------------------------------------------------------------------
# Names — mDNS responder answers <hostname>.local, DNS-SD advertises the NTP
# and NTS-KE services (spec §4.5), and getaddrinfo() resolves the syslog / SNMP
# trap destinations (numeric or, with the resolver, by name).
# ---------------------------------------------------------------------------
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
CONFIG_DNS_RESOLVER=y

# ---------------------------------------------------------------------------
# Socket / context budget. Sockets in flight at once: NTP v4+v6 (2), PTP event
# +general or L2 (1-2), SNMP agent v4+v6 (2) + trap (1), NTS-KE listen + one
# connection (2), syslog (1), mDNS + DNS-SD + resolver internals. The prj.conf
# defaults (16 contexts) are tight once mDNS and the resolver are added.
# ZVFS_OPEN_MAX bounds the socket fd table.
# ---------------------------------------------------------------------------
CONFIG_NET_MAX_CONTEXTS=24
CONFIG_ZVFS_OPEN_MAX=24
CONFIG_NET_SOCKETS_POLL_MAX=8
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_IF_MAX_IPV6_COUNT=3

# ===========================================================================
# NTS-KE TLS 1.3 server (spec §4.2) — READY, one cross-area line from live.
# ===========================================================================
# sts_ntske.c is a complete TLS 1.3 NTS-KE server driving mbedTLS directly
# (Zephyr's TLS socket layer exposes no RFC 8446 exporter — see the file).
# Its body is compiled only when mbedTLS carries MBEDTLS_SSL_KEYING_MATERIAL_
# EXPORT (mbedtls_ssl_export_keying_material(), the RFC 8446 §7.5 key
# derivation NTS depends on). Zephyr's mbedTLS config omits that macro and
# offers NO Kconfig for it, so it is enabled through the overlay header
# sts_mbedtls_user.h — which must sit on the mbedTLS library's include path.
#
# Everything below is COMMENTED OUT on purpose: enabling the TLS 1.3 stack and
# the user-config header before the include-dir line exists would either waste
# ~45 KB of RAM/flash on code the exporter guard compiles out, or break the
# build with an unresolved #include. NTS-KE therefore reports "unavailable"
# until an owner performs THREE steps together:
#
#   1. app/CMakeLists.txt (platform/W3a area), before find_package(Zephyr):
#          zephyr_include_directories(${CMAKE_CURRENT_SOURCE_DIR}/src/zephyr/net)
#   2. uncomment the two user-config lines here;
#   3. uncomment the mbedTLS TLS 1.3 block here.
#
# (The ECDHE-ECDSA suite and key exchange are selected by PSA under TLS 1.3 in
# mbedTLS 3.6, so no legacy MBEDTLS_KEY_EXCHANGE_* symbol is set.)
#
#   CONFIG_MBEDTLS_USER_CONFIG_ENABLE=y
#   CONFIG_MBEDTLS_USER_CONFIG_FILE="sts_mbedtls_user.h"
#
#   CONFIG_MBEDTLS_TLS_VERSION_1_3=y
#   CONFIG_MBEDTLS_SSL_ALPN=y
#   CONFIG_MBEDTLS_X509_CRT_WRITE_C=y
#   CONFIG_MBEDTLS_PK_WRITE_C=y
#   CONFIG_MBEDTLS_ECDSA_C=y
#   CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
#   CONFIG_MBEDTLS_HKDF_C=y
#   CONFIG_MBEDTLS_CTR_DRBG_ENABLED=y
#   CONFIG_MBEDTLS_ENTROPY_C=y
#   CONFIG_MBEDTLS_PSA_CRYPTO_C=y
#   CONFIG_MBEDTLS_USE_PSA_CRYPTO=y
#   CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_EPHEMERAL_ENABLED=y
#   CONFIG_MBEDTLS_HEAP_SIZE=49152   # single global; raises console.conf's 4096
# ===========================================================================
