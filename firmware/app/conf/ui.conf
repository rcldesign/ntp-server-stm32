# STS1000 "Meridian" — local-UI area (TFT, touch, encoder, backlight).
# SPDX-License-Identifier: Apache-2.0
#
# Merged on top of app/prj.conf by app/CMakeLists.txt's conf/ glob. Only what
# src/zephyr/ui/ needs beyond what prj.conf already enables (I2C, SPI, PWM,
# SENSOR are all on there).

# ---------------------------------------------------------------------------
# Display: Sitronix ST7796S over the MIPI-DBI mode-C (SPI) shim.
#
# CONFIG_ST7796S defaults to y from DT_HAS_SITRONIX_ST7796S_ENABLED and selects
# MIPI_DBI itself; both are stated here so the dependency is visible in one
# place and a DT change cannot silently drop the driver.
#
# The panel has no MISO (interface ref §9), so the shim is write-only and every
# read path is compiled out.
# ---------------------------------------------------------------------------
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_MIPI_DBI_SPI=y
CONFIG_ST7796S=y

# The display and its shim are `zephyr,deferred-init`, which needs the runtime
# device_init() entry point. (The board already relies on this for the SPI-NOR,
# so this is a statement of the dependency rather than a new one.)
CONFIG_DEVICE_DEPS=y

# ---------------------------------------------------------------------------
# Rotary encoder: TIM1 in hardware quadrature mode.
#
# The in-tree qdec driver owns initialisation only — pinctrl (PA8/PA9), the
# TIM1 clock gate, encoder mode x4 and the input filter. The UI reads TIM1's
# counter directly for exact detent deltas rather than through
# SENSOR_CHAN_ROTATION, whose degrees-since-index representation loses counts
# on the way back to an integer (see src/zephyr/ui/ui_input.c).
# ---------------------------------------------------------------------------
CONFIG_QDEC_STM32=y

# ---------------------------------------------------------------------------
# Sizes.
#
# The render thread owns a 60x20 tile grid, its shadow copy and a blit
# scratch (~8 KB of BSS in ui_display.c), and it is the only consumer here.
# ---------------------------------------------------------------------------
CONFIG_STS1000_UI_RENDER_STACK_SIZE=3072
