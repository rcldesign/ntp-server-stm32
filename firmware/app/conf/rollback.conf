# STS1000 "Meridian" — anti-rollback: the image security epoch.
# SPDX-License-Identifier: Apache-2.0
#
# Merged by the glob in app/CMakeLists.txt in sorted filename order
# (console < mp < net < platform < rollback < security < ui). Nothing here
# depends on another fragment.
#
# ===========================================================================
# THE TWO VALUES BELOW MUST BE THE SAME NUMBER. app/CMakeLists.txt fails the
# configure step if they are not, so this cannot drift silently.
# ===========================================================================
#
#   CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS   what gets SIGNED into the image, as
#                                       IMAGE_TLV_SEC_CNT (0x50) in the
#                                       protected TLV area. This is the value
#                                       MCUboot compares.
#   CONFIG_STS1000_SECURITY_EPOCH       what the FIRMWARE knows it is running.
#                                       Used to refuse a staged downgrade at
#                                       upload time (console/fwupd_glue.c) and
#                                       to step the ATECC608B witness counter
#                                       (console/sts_rollback.c).
#
# They are separate symbols only because Kconfig cannot interpolate one symbol
# into another's string value. sts_rollback.c additionally re-reads the counter
# actually present in slot 0 at runtime and refuses to witness an epoch it
# cannot corroborate, so a build where the imgtool argument silently failed to
# apply is detected on the device as well as at configure time.
#
# ---------------------------------------------------------------------------
# HOW TO BUMP THE EPOCH (the whole procedure — there is nothing else)
# ---------------------------------------------------------------------------
# Bump ONLY for a release that fixes a vulnerability which must not become
# reachable again by re-installing an older signed image. Not for features, not
# for bug fixes, not per release, and never from a script.
#
#   1. Decide, and write down why. The epoch is a one-way ratchet in the field:
#      once a unit confirms an image at epoch N, every image at epoch < N is
#      permanently un-installable on that unit — including a rollback you may
#      later wish you could do. `app/VERSION` is how you say "this is a new
#      release"; the epoch is how you say "the old one must never run again".
#   2. Increment BOTH numbers below by one. Same value. Nothing else changes —
#      app/VERSION moves on its own schedule and has no relationship to this.
#   3. Pristine build:  firmware/scripts/build.sh -p -d <dir>
#   4. VERIFY THE SIGNED IMAGE, every time. A configuration that fails to reach
#      imgtool produces a perfectly valid image with no counter in it, which
#      then cannot be installed on any unit already running a counter-bearing
#      image:
#
#        imgtool dumpinfo <dir>/app/zephyr/zephyr.signed.bin
#
#      Expect a non-zero `protected_tlv_size` and a `SEC_CNT (0x50)` entry in
#      the TLV area whose data is the new value, little-endian.
#   5. Ship it. Units running epoch N-1 accept it (N >= N-1); units that later
#      confirm it can no longer be sent anything below N.
#
# ---------------------------------------------------------------------------
# WHAT HAPPENS TO AN IMAGE WITH NO COUNTER
# ---------------------------------------------------------------------------
# MCUboot's check_downgrade_prevention() allows a swap when slot 0 has no
# counter, which is what makes the very first upgrade from a pre-anti-rollback
# image work. Once slot 0 HAS one, a staged image without one is refused. So
# from this commit on, every image built for this product must be signed with
# --security-counter; a build that drops this fragment produces an image that
# stages, verifies, and is then silently declined at the next boot.
# console/fwupd_glue.c refuses such an image at upload time instead, with a log
# line that names the reason.
#
# ---------------------------------------------------------------------------
# BUDGET
# ---------------------------------------------------------------------------
# The gate itself has none: IMAGE_TLV_SEC_CNT is a uint32, so 4 294 967 295
# epochs.
#
# The binding constraint is the ATECC608B witness counter, which saturates at
# 2 097 151 (2^21 - 1, datasheet §4.2 "Monotonic counters"). At one increment
# per security epoch, and being generous at four security-relevant releases a
# year, that is 524 287 years. The witness is why the increment must NEVER be
# moved to a per-boot or per-upgrade path: at one per boot, a unit rebooting
# daily exhausts it in 5745 years — survivable — but at one per boot with a
# fault-induced reboot loop at, say, 10 s a cycle it is gone in 243 days, and
# the counter cannot be reset. Hence sts_atecc.h's standing warning ("never
# anything that runs on every boot") and the corroboration + step-to-target
# design in console/sts_rollback.h, which performs zero increments on every
# boot after the first confirmation at a given epoch.
# ---------------------------------------------------------------------------

CONFIG_STS1000_SECURITY_EPOCH=1
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--security-counter 1"

# The witness. Off is a legitimate configuration for a board with no secure
# element fitted, but it is not needed for that — the runtime path already
# degrades to a log line on -ENODEV — so leave it on.
CONFIG_STS1000_ROLLBACK_WITNESS=y
CONFIG_STS1000_ROLLBACK_ATECC_COUNTER=0
