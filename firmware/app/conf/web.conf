# STS1000 "Meridian" — web management plane (HTTPS + REST + WSS, spec §5.1).
# SPDX-License-Identifier: Apache-2.0
#
# Merged LAST by the glob in app/CMakeLists.txt (sorted filename order:
# console < net < platform < ui < web), so anything set here wins over the other
# fragments. That matters for CONFIG_MBEDTLS_HEAP_SIZE, which is a single global
# shared with every other mbedTLS user in the image.
#
# ---------------------------------------------------------------------------
# TLS transport
# ---------------------------------------------------------------------------
# HTTPS uses Zephyr's TLS *sockets* (IPPROTO_TLS_1_2 + TLS_SEC_TAG_LIST), unlike
# sts_ntske.c which drives mbedTLS directly because NTS-KE needs the RFC 8446
# exporter that the socket layer does not expose. HTTPS needs no exporter, so the
# socket layer is the right level and this file does NOT enable the user-config
# header that NTS-KE is still waiting on.
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=6

# One context per concurrent TLS connection plus the listening socket, plus one
# for the AAA client.
#
# STS_WEB_WORKERS is 2, so the web plane alone needs 3 (see
# src/zephyr/net/sts_web.h). The fourth is LDAPS: sts_aaa.c opens an outbound
# TLS socket for `sec.ldap.mode = 2`, and the login that triggers it is normally
# being served by one of those very workers — so at 3 a directory bind attempted
# while both workers are busy fails at socket() with no context left, which the
# operator sees as an intermittently unreachable LDAP server. One AAA exchange
# runs at a time board-wide (the sts_secops.c gate), so one is enough.
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=4

# Record buffers. The Zephyr default is 1500 in each direction; the SPA's largest
# single response is a config page or a nine-rail power snapshot, and 2 KB records
# keep the per-session RAM down while still sending those in a handful of records.
# Two directions x 3 contexts, so every 1 KB here costs ~6 KB of SRAM.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=2048

# TLS 1.3 only, per spec §5.1 ("TLS 1.3 only, 1.2 configurable for legacy").
# NET_SOCKETS_SOCKOPT_TLS `imply`s 1.2 plus the whole RSA/PKCS1 key-exchange set;
# every one of those is turned back off here. That is both the policy the spec
# asks for and a large flash saving — RSA, PKCS#1 v1.5/v2.1 and the legacy
# key-exchange table are all dead weight for an ECDSA-only server.
CONFIG_MBEDTLS_TLS_VERSION_1_3=y
CONFIG_MBEDTLS_TLS_VERSION_1_2=n
CONFIG_MBEDTLS_DTLS=n
CONFIG_MBEDTLS_RSA_C=n
CONFIG_MBEDTLS_PKCS1_V15=n
CONFIG_MBEDTLS_PKCS1_V21=n
CONFIG_MBEDTLS_KEY_EXCHANGE_RSA_ENABLED=n

# TLS 1.3 in mbedTLS 3.6 is implemented on PSA Crypto, so PSA is not optional
# here. MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_EPHEMERAL_ENABLED selects plain
# ECDHE (no PSK), which is what a public-facing HTTPS server wants.
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_USE_PSA_CRYPTO=y
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_EPHEMERAL_ENABLED=y
CONFIG_MBEDTLS_HKDF_C=y

# TLS 1.3's key schedule is expressed entirely in PSA terms, so mbedTLS checks
# for PSA_WANT_* rather than for its own legacy symbols (check_config.h:815).
# Leaving these out produces "MBEDTLS_SSL_PROTO_TLS1_3 defined, but not all
# prerequisites", which is a #error a long way from its cause — hence the
# explicit list.
CONFIG_PSA_WANT_ALG_HKDF_EXTRACT=y
CONFIG_PSA_WANT_ALG_HKDF_EXPAND=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y

# ECDHE + ECDSA on P-256, AES-GCM, SHA-256/384. No curve or suite beyond what the
# certificate this firmware generates actually uses.
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECDSA_C=y
# NOT MBEDTLS_ECDSA_DETERMINISTIC (RFC 6979): it requires MBEDTLS_HMAC_DRBG_C,
# and the CTR-DRBG this build already seeds from the STM32 TRNG is a perfectly
# good nonce source for ECDSA. Enabling it would add a second DRBG to the image
# for no security gain here.
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y
CONFIG_MBEDTLS_CIPHER_MODE_CBC_ENABLED=n
CONFIG_MBEDTLS_SHA256=y
CONFIG_MBEDTLS_SHA384=y
CONFIG_MBEDTLS_ENTROPY_C=y
CONFIG_MBEDTLS_CTR_DRBG_ENABLED=y

# ---------------------------------------------------------------------------
# X.509 writing — needed for the self-signed certificate and the CSR
# ---------------------------------------------------------------------------
# These are what make sts_cert.c's body compile; without them it degrades to
# "no certificate support", HTTPS does not start, and the log says so.
#
# There is no CONFIG_ for MBEDTLS_X509_CREATE_C or MBEDTLS_PEM_WRITE_C: Zephyr's
# configs/config-mbedtls.h derives the first from X509_CRT/CSR_WRITE_C and the
# second from PEM_CERTIFICATE_FORMAT, so setting them here would be an "undefined
# symbol" Kconfig error. PEM_CERTIFICATE_FORMAT is therefore mandatory rather
# than cosmetic: both the credential store and the CSR download are PEM.
CONFIG_MBEDTLS_X509_CRT_WRITE_C=y
CONFIG_MBEDTLS_X509_CSR_WRITE_C=y
CONFIG_MBEDTLS_PK_WRITE_C=y
CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=y

# ---------------------------------------------------------------------------
# mbedTLS heap
# ---------------------------------------------------------------------------
# ONE global heap for every mbedTLS user in the image. It has to cover, at once:
# up to 3 TLS 1.3 sessions (each with a 2 KB in and a 2 KB out record buffer plus
# the handshake transcript and key schedule), the ECDSA/ECDH scratch for P-256,
# and the x509write buffers during first-boot certificate generation.
#
# 32 KB is an ESTIMATE, not a measurement: ~12 KB of record buffers + ~4 KB per
# in-flight handshake + keygen scratch, with margin. It has NOT been validated on
# hardware, and it is the single largest discretionary SRAM line in the web plane.
# Under-sizing it fails a handshake with MBEDTLS_ERR_*_ALLOC_FAILED, which the
# operator sees as "the browser cannot connect" — so this is a bench-tune item:
# run three concurrent TLS 1.3 handshakes plus a first-boot keygen and watch the
# high-water mark before trimming it.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=32768

# ---------------------------------------------------------------------------
# Sockets and file descriptors
# ---------------------------------------------------------------------------
# net.conf sizes these for the time services; the web plane adds a TLS listener,
# a plain-HTTP redirect listener, and up to STS_WEB_WORKERS accepted sockets
# (each TLS socket consumes an underlying TCP socket as well).
#
# net.conf's 24, plus six for the web plane (the TLS listener, the redirect
# listener, and two accepted TLS sockets, each of which also consumes the TCP
# context underneath), plus security.conf's two for the AAA cluster (one
# exchange at a time, plus the resolver). This file merges last, so its value is
# the one that lands — which is why the AAA pair has to be counted here and not
# only in security.conf, where it is described. An LDAPS bind is one of that
# pair and needs the TCP context under its TLS socket.
#
# Every extra context costs a TCP connection slab entry (~680 B), so this is the
# measured minimum rather than a round number.
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_NET_SOCKETS_POLL_MAX=12

# The TCP window sizes are deliberately left at Zephyr's defaults: raising them
# grows a per-connection buffer, and the SPA's transfers are small and latency-
# insensitive. If large firmware uploads over HTTPS turn out to be slow, that is
# the knob — and it is a measured trade against SRAM, not a free win.

# ---------------------------------------------------------------------------
# Not enabled, and why
# ---------------------------------------------------------------------------
# CONFIG_STS1000_ACME does not exist: the net area has no Kconfig fragment (see
# app/Kconfig, which sources only console/ and ui/), so the ACME skeleton in
# sts_cert.c is guarded by a symbol nothing defines and is therefore compiled
# out. Promoting it — along with the STS_WEB_* tunables in
# src/zephyr/net/sts_web.h — needs one `rsource "src/zephyr/net/Kconfig"` line in
# app/Kconfig, which belongs to the platform area.
#
# CONFIG_MBEDTLS_TLS_VERSION_1_2 is off. If a legacy client ever needs it, turn
# it on here together with the ECDHE-ECDSA suite it requires; do NOT re-enable
# the RSA symbols above unless an RSA server certificate is actually deployed.
