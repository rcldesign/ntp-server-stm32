# STS1000 "Meridian" — Maintenance Protocol (FMT device side).
# SPDX-License-Identifier: Apache-2.0
#
# Merged after prj.conf and the other conf/ fragments (app/CMakeLists.txt globs
# and sorts conf/*.conf, so `mp.conf` lands after `console.conf` and can rely on
# the console area's settings).
#
# MP shares CDC-ACM #0 with the human shell rather than taking a third endpoint:
# `mp enter` installs a shell bypass and every received byte then goes to the
# protocol (see src/zephyr/console/mp_glue.c). That needs no extra USB
# interface, but it does need the two shell features below.

# ---------------------------------------------------------------------------
# Shell bypass — the mechanism the mode hand-off is built on. Without it the
# console cannot be handed to a binary protocol at all, and sts_mp_start()
# would have no way to take the port.
# ---------------------------------------------------------------------------
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# The MP frame layer accepts a 2048 B payload, and a reply or a mirror keyframe
# is fragmented into 1024 B frames. The shell's serial TX ring is not on that
# path (MP writes the UART directly while bypassed), but the ring still has to
# absorb the burst of shell output produced by `mp status`.
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=1024

# ---------------------------------------------------------------------------
# hwinfo — the G2 confirmation string is the device serial, derived from the
# STM32 unique ID. Without it the serial reads "UNPROVISIONED" and every G2/G3
# action refuses, which is the correct fail-safe but makes the box unserviceable.
# ---------------------------------------------------------------------------
CONFIG_HWINFO=y

# ---------------------------------------------------------------------------
# The support bundle (diag.snapshot) and the log stream both render structured
# log records, so the ring has to be large enough to be worth fetching.
# ---------------------------------------------------------------------------
CONFIG_LOG=y
