# STS1000 "Meridian" — platform-area Kconfig fragment.
# SPDX-License-Identifier: Apache-2.0
#
# Merged after prj.conf by app/CMakeLists.txt. Only settings the platform area
# (timing engine, 1 kHz scan, housekeeping, supervisor) needs live here; the
# net, console and ui areas own conf/net.conf, conf/console.conf and
# conf/ui.conf respectively.

# ---------------------------------------------------------------------------
# Clock security system
#
# HSECSSON is armed by the clock-mux glue once HSE is stable, because the
# STM32H5 clock driver never does it and ignores `css-enabled` in devicetree.
# CSS is the hardware backstop for a reference that stops while selected on
# PH0 — the Rb-loss case interface ref §3 says the design survives. Once armed
# it can only be cleared by reset, so the NMI it raises must be handled: the
# Zephyr default resets the SoC, which would turn "the rubidium died" into "the
# grandmaster rebooted". CONFIG_RUNTIME_NMI lets the platform install a handler
# that clears HSECSSF, latches the event and lets the discipline thread revert
# to the OCXO.
# ---------------------------------------------------------------------------
CONFIG_RUNTIME_NMI=y

# ---------------------------------------------------------------------------
# Timing-engine peripherals
#
# The PWM driver is enabled for the fan (TIM15_CH1) and the status RGB
# (TIM4_CH1..3), and it also brings up the clock gate and pin mux for the three
# capture timers (TIM2, TIM3, TIM12) whose capture registers the platform
# programs directly — there is no Zephyr input-capture driver for them.
#
# PWM_CAPTURE stays OFF on purpose: enabling it would make pwm_stm32 install
# its own ISR on the TIM2/TIM3 IRQ lines, which is where the PPS capture ISR
# lives.
# ---------------------------------------------------------------------------
CONFIG_PWM=y
CONFIG_PWM_CAPTURE=n
CONFIG_DAC=y
CONFIG_ADC=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_GPIO=y

# STM32 internal die-temperature sensor (die_temp node), the thermal ladder's
# tertiary fallback behind the two TMP117s.
CONFIG_STM32_TEMP=y

# The clock-mux glue needs the non-inline LL_RCC_GetSystemClocksFreq(), whose
# source (stm32h5xx_ll_rcc.c) is compiled only when USE_STM32_LL_RCC is set.
# That symbol is promptless and cannot be assigned in a .conf, so it is
# select-ed by STS1000_FORCE_LL_RCC in app/Kconfig instead. Every other LL call
# this area makes (LL_TIM, LL_GPIO, LL_LPTIM, LL_RCC bit ops) is inline and
# needs no module.

# ---------------------------------------------------------------------------
# Real-time clock and backup SRAM
#
# RTC: time-of-day across a reboot, and the wall-clock stamp on log records
# when no PTP time source has been registered yet.
# Backup SRAM: the PFI fast-save landing zone (spec §8/§12) — it is powered
# from the supercap-backed VBAT well, so a write started when PFI fires
# survives the rail collapse without needing a flash erase to complete.
# Both nodes are already `okay` in the board .dts; without these symbols no
# driver is built for either.
# ---------------------------------------------------------------------------
CONFIG_RTC=y
CONFIG_STM32_BACKUP_SRAM=y

# ---------------------------------------------------------------------------
# The external TPS3430 windowed watchdog (WDT_EN/PC12 + WDT_KICK/PB2) is the
# real supervisor. The STM32 IWDG stays off so it cannot pre-empt the
# hardware-OR'd POE_KILL path with a reset the PSE never sees.
# ---------------------------------------------------------------------------
CONFIG_WATCHDOG=n

# ---------------------------------------------------------------------------
# Floating point
#
# The discipline loop, the ADEV estimators and the thermal PI all run in
# single-precision float. Without the hardware FPU enabled they would be
# soft-float calls inside a 1 Hz loop that has a microsecond budget.
# ---------------------------------------------------------------------------
CONFIG_FPU=y

# ---------------------------------------------------------------------------
# Interrupt latency
#
# The PPS capture ISR runs at priority 0. Zephyr's default direct-ISR path is
# fine, but the capture value itself is latched in hardware, so what this
# actually protects is the TIM3 pairing window (131 us) and the overcapture
# margin.
# ---------------------------------------------------------------------------
CONFIG_DYNAMIC_INTERRUPTS=n
