# STS1000 "Meridian" — console area (USB, shell, MCP, storage, DFU).
# SPDX-License-Identifier: Apache-2.0
#
# Merged on top of app/prj.conf. app/CMakeLists.txt has to list it, e.g.
#
#     list(APPEND EXTRA_CONF_FILE ${CMAKE_CURRENT_SOURCE_DIR}/conf/console.conf)
#
# before find_package(Zephyr). Everything below is either required for the area
# to build (mbedTLS, log_output) or corrects a prj.conf default that predates
# the area (USB_DEVICE_INITIALIZE_AT_BOOT).

# ---------------------------------------------------------------------------
# USB — the VBUS gate owns the attach/detach lifecycle.
#
# prj.conf enables CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT so the console is live
# from the first log line. That predates USB_VBUS_SENSE (PE2): the board is
# self-powered, and USB 2.0 §7.1.5 forbids presenting the D+ pull-up while VBUS
# is absent. src/zephyr/console/sts_usb.c therefore owns usb_enable() and
# usb_disable(). It still tolerates the boot hook being on (usb_enable returns
# -EALREADY and DTR substitutes for the status callback), so this line is a
# correctness fix rather than a build requirement.
# ---------------------------------------------------------------------------
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n

# ---------------------------------------------------------------------------
# Logging — the Zephyr LOG -> core/logring bridge is a custom backend, and a
# backend needs the formatter helper to render a log_msg into text.
# ---------------------------------------------------------------------------
CONFIG_LOG_OUTPUT=y

# ---------------------------------------------------------------------------
# Shell.
# ---------------------------------------------------------------------------
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_ARGC_MAX=12
CONFIG_SHELL_HELP=y
CONFIG_SHELL_HISTORY=y
# The shell writes to a CDC-ACM endpoint whose host may be absent; a ring lets
# a burst of output drain instead of blocking the command handler.
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=1024
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=256

# ---------------------------------------------------------------------------
# mbedTLS — port_crypto_t / port_sha256_stream_t (src/zephyr/storage).
#
# AES-ECB is the primitive core/nts builds AES-SIV-CMAC-256 on; SHA-256 backs
# the DFU image verify and the NTP symmetric MAC; the generic message-digest
# layer supplies HMAC-SHA-256 for the MCP session credential.
#
# The heap is required by mbedtls_md_hmac(), which allocates its ipad/opad pair
# through mbedtls_calloc. ~256 B is the real demand; 4 KB leaves room without
# being the kind of number that hides a leak. CONFIG_MBEDTLS_INIT (default y)
# installs the allocator at boot.
#
# NOTE for the net area: MBEDTLS_HEAP_SIZE is a single global. TLS 1.3 for
# NTS-KE and HTTPS will need far more (tens of KB); raise it there rather than
# setting it twice, or Kconfig will report the symbol as assigned more than
# once.
# ---------------------------------------------------------------------------
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_SHA256=y
CONFIG_MBEDTLS_MD=y
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=4096

# ---------------------------------------------------------------------------
# Storage.
#
# NVS on storage_partition is reached directly (see store_nvs.c for why the
# settings subsystem is bypassed). LittleFS needs a per-file cache; the spool
# keeps one file open, and fs_mkdir/fs_truncate need a second allocation
# transiently.
# ---------------------------------------------------------------------------
CONFIG_FS_LITTLEFS_FC_HEAP_SIZE=4096
CONFIG_FS_LITTLEFS_NUM_FILES=4
CONFIG_FS_LITTLEFS_NUM_DIRS=2

# ---------------------------------------------------------------------------
# Diagnostics used by `sts diag threads` and MCP DIAG sub 3. All are already
# set in prj.conf; repeated here because the DIAG payload silently degrades to
# -ENOTSUP without them.
# ---------------------------------------------------------------------------
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
