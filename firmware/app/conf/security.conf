# STS1000 "Meridian" — security cluster (SNMPv3/USM, ATECC608B, AAA).
# SPDX-License-Identifier: Apache-2.0
#
# Merged by the glob in app/CMakeLists.txt in sorted filename order
# (console < net < platform < security < ui), so this fragment is applied after
# net.conf and can rely on its transports being present. Only symbols this
# cluster needs live here.
#
# What this cluster deliberately does NOT need:
#
#   * No extra crypto Kconfig. core/snmp's USM builds AES-128-CFB out of the
#     AES-ECB primitive port_crypto already provides, and takes SHA-256 and
#     HMAC-SHA-256 from the same port. SHA-1 (for RFC 3414's mandatory auth
#     protocol) and MD5 (for the RADIUS and TACACS+ wire formats) are private to
#     their core modules — see snmp_v3.h and auth.h for why they are there and
#     not in the port.
#   * No new CONFIG_STS1000_* area switch. sts_aaa.c lives under src/zephyr/net/
#     and sts_atecc.c under src/zephyr/storage/, so they follow the existing
#     CONFIG_STS1000_NET and CONFIG_STS1000_CONSOLE gates.

# ---------------------------------------------------------------------------
# I2C1 — the ATECC608B is device sixteen on the bus (interface ref §4).
#
# The wake token needs the bus dropped to 100 kHz for one transfer and restored
# to 400 kHz afterwards, which is a runtime i2c_configure() call; nothing to
# enable here beyond the controller itself, which prj.conf already carries.
#
# CONFIG_I2C_STATS is deliberately NOT set: it depends on CONFIG_STATS, which
# would allocate a stats structure for every driver instance in the image for the
# sake of one bring-up convenience. core/atecc already counts wakes, retries, CRC
# errors and bus errors itself (atecc_stats_t), and sts_atecc_stats() surfaces
# them — which is the same information without the system-wide cost.
# ---------------------------------------------------------------------------
CONFIG_I2C=y

# ---------------------------------------------------------------------------
# HWINFO — the fallback device-unique value for the SNMP engine id (RFC 3411
# §5) when the secure element is absent or unprovisioned. Already enabled in
# prj.conf; stated here because sts_atecc.c depends on it directly.
# ---------------------------------------------------------------------------
CONFIG_HWINFO=y

# ---------------------------------------------------------------------------
# Sockets for the AAA backends.
#
#   RADIUS   UDP 1812                    (NET_UDP, prj.conf)
#   TACACS+  TCP 49                      (NET_TCP, prj.conf)
#   LDAP     TCP 389                     (NET_TCP, prj.conf)
#
# sts_aaa.c bounds every exchange with SO_RCVTIMEO / SO_SNDTIMEO so a slow or
# hostile server cannot pin a management thread. Those two options need no
# Kconfig symbol — Zephyr 4.2 handles them unconditionally in
# subsys/net/lib/sockets/sockets_inet.c — so there is nothing to enable here,
# and the timeouts are effective as written.
#
# Only two sockets are ever in flight from this cluster (one AAA exchange at a
# time, plus the resolver), but they land on top of the budget net.conf already
# sizes for NTP, PTP, SNMP, NTS-KE, syslog and mDNS.
# ---------------------------------------------------------------------------
CONFIG_NET_MAX_CONTEXTS=26
CONFIG_ZVFS_OPEN_MAX=26

# ===========================================================================
# LDAPS — COMPILED IN. What a working deployment still needs is a trust anchor.
# ===========================================================================
# `sec.ldap.mode` selects plain (0), StartTLS (1) or LDAPS (2).
#
# There is nothing to enable here. app/conf/web.conf sets
# CONFIG_NET_SOCKETS_SOCKOPT_TLS=y and CONFIG_TLS_CREDENTIALS=y for HTTPS,
# Kconfig symbols are global, and app/CMakeLists.txt globs every fragment in
# conf/ into every image — so sts_aaa.c's `#if defined(CONFIG_NET_SOCKETS_
# SOCKOPT_TLS)` blocks are built, and mode 2 is reachable at runtime in the
# shipped configuration. (An earlier version of this block said the opposite and
# listed the two symbols as things to uncomment. It was wrong; sts_secops.c
# already sizes its worker stack for the mbedTLS handshake on that basis.)
#
# WHAT LDAPS DOES NEED, AND WHAT HAPPENS WITHOUT IT
#
# A trust anchor. Zephyr's TLS client verifies the peer by default — it leaves
# mbedTLS at MBEDTLS_SSL_VERIFY_REQUIRED unless TLS_PEER_VERIFY says otherwise —
# so with no CA registered the handshake cannot succeed at all. That is
# fail-CLOSED (the bind password never reaches the wire), but it is also
# non-functional, so sts_aaa.c refuses mode 2 BEFORE opening the socket and logs
# "no LDAP CA installed" rather than leaving an mbedTLS error code to interpret.
#
# The operator installs the issuer certificate as PEM through the admin-only
# route POST /api/v1/security/ldap-ca; it is persisted to /lfs/tls/ldap_ca.pem,
# registered under sec tag "LDA1", and erased by the factory reset. sts_aaa.c
# also sets TLS_HOSTNAME from `sec.ldap.host`, so the certificate's NAME is
# checked and not merely its chain — which means a host configured as a bare IP
# address needs an iPAddress SAN in the directory server's certificate.
#
# There is no "verify none" option, on purpose. See zephyr/net/sts_ldap_ca.h.
#
# StartTLS (mode 1) stays unavailable, and that is a platform limit rather than
# a missing option: it needs an in-place socket upgrade, and Zephyr's TLS is a
# socket *type* chosen at socket() time, not something negotiated later.
# sts_aaa.c refuses mode 1 and points at LDAPS. Prefer LDAPS on 636.
#
# Socket budget: an in-flight LDAPS bind costs one TLS context and one TCP
# context on top of the web plane's — accounted for in web.conf, which merges
# after this file and therefore owns the final values.
# ===========================================================================
