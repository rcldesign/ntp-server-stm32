# OpenOCD configuration for the STS1000 "Meridian" (STM32H563ZIT6, ST-LINK/SWD).
#
# SWD only — PB4/NJTRST is used as UART7_TX (`RB_RX`), so JTAG is not available
# on this board (interface ref §10.1). J3 carries SWDIO/SWCLK/SWO/NRST.

source [find interface/stlink-dap.cfg]

transport select "dapdirect_swd"

set CHIPNAME STM32H563ZITX
set BOARDNAME STS1000_MERIDIAN

source [find target/stm32h5x.cfg]

# NRST (J3.5) is wired; connect under reset so a running low-power/WFI
# application cannot block attach.
reset_config srst_only srst_nogate connect_assert_srst
set CONNECT_UNDER_RESET 1
set CORE_RESET 0

# Because of connect_assert_srst, halt the core right after init so gdb has a
# stopped target to attach to.
rename init old_init
proc init {} {
	old_init
	reset halt
}
