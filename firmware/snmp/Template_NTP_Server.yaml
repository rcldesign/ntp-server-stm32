          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.1.8.0
          key: meridian.pps.offset
          delay: 30s
          history: 31d
          units: ns
          tags:
            - tag: component
              value: timing
        - uuid: a1000000000000000000000000000018
          name: 'Timing: PPS offset mean'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.1.9.0
          key: meridian.pps.mean
          delay: 1m
          history: 31d
          units: ns
          tags:
            - tag: component
              value: timing
        - uuid: a1000000000000000000000000000019
          name: 'Timing: PPS offset sigma'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.1.10.0
          key: meridian.pps.sigma
          delay: 1m
          history: 31d
          units: ns
          tags:
            - tag: component
              value: timing
        - uuid: a1000000000000000000000000000020
          name: 'Timing: fractional frequency error'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.1.11.0
          key: meridian.freq.err
          delay: 1m
          history: 31d
          units: ppt
          description: 'Parts per trillion (ppb x 1000, so sub-ppb is not quantised away)'
          tags:
            - tag: component
              value: timing
        - uuid: a1000000000000000000000000000021
          name: 'Timing: OCXO Vc commanded'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.1.12.0
          key: meridian.vc.cmd
          delay: 1m
          history: 31d
          units: mV
          tags:
            - tag: component
              value: timing
        - uuid: a1000000000000000000000000000022
          name: 'Timing: OCXO Vc sensed'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.1.13.0
          key: meridian.vc.sense
          delay: 1m
          history: 31d
          units: mV
          tags:
            - tag: component
              value: timing
        - uuid: a1000000000000000000000000000023
          name: 'Timing: ADEV tau=1s'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.1.14.0
          key: meridian.adev.1s
          delay: 5m
          history: 31d
          description: 'Allan deviation x 1e18'
          tags:
            - tag: component
              value: timing
        - uuid: a1000000000000000000000000000024
          name: 'Timing: ADEV tau=10s'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.1.15.0
          key: meridian.adev.10s
          delay: 5m
          history: 31d
          tags:
            - tag: component
              value: timing
        - uuid: a1000000000000000000000000000025
          name: 'Timing: ADEV tau=100s'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.1.16.0
          key: meridian.adev.100s
          delay: 5m
          history: 31d
          tags:
            - tag: component
              value: timing
        - uuid: a1000000000000000000000000000026
          name: 'Timing: oscillator temperature'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.1.17.0
          key: meridian.osc.temp
          delay: 1m
          history: 31d
          value_type: FLOAT
          units: °C
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.001'
          tags:
            - tag: component
              value: timing

        # ---- GNSS (enterprise .1.2) -------------------------------------
        - uuid: a1000000000000000000000000000030
          name: 'GNSS: fix type'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.2.1.0
          key: meridian.gnss.fix
