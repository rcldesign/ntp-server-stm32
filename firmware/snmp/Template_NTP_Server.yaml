          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          units: '!rsp/s'
          tags:
            - tag: component
              value: ntp
        - uuid: a1000000000000000000000000000052
          name: 'NTP: requests dropped'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.5.3.0
          key: meridian.ntp.dropped
          delay: 1m
          history: 7d
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
