              value: ntp
        - uuid: a1000000000000000000000000000051
          name: 'NTP: responses served'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.5.2.0
          key: meridian.ntp.served
          delay: 1m
