          tags:
            - tag: component
              value: timing
        - uuid: a1000000000000000000000000000015
          name: 'Timing: holdover elapsed'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.1.6.0
          key: meridian.holdover.elapsed
          delay: 1m
          history: 31d
          units: s
          tags:
            - tag: component
              value: timing
        - uuid: a1000000000000000000000000000016
          name: 'Timing: time to stratum demotion'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.1.7.0
          key: meridian.holdover.demote
          delay: 1m
          history: 31d
          units: s
          tags:
            - tag: component
              value: timing
        - uuid: a1000000000000000000000000000017
