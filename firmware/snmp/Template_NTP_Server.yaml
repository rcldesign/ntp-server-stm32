        - uuid: a1000000000000000000000000000043
          name: 'Environment: fan speed'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.4.5.0
          key: meridian.fan.rpm
          delay: 1m
          history: 31d
          units: rpm
          tags:
            - tag: component
              value: environment
        - uuid: a1000000000000000000000000000044
          name: 'Environment: fan duty cycle'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.4.6.0
          key: meridian.fan.duty
          delay: 1m
          history: 31d
          units: '%'
          tags:
            - tag: component
              value: environment

        # ---- time services (enterprise .1.5) ----------------------------
        - uuid: a1000000000000000000000000000050
          name: 'NTP: requests received'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.5.1.0
          key: meridian.ntp.rx
          delay: 1m
          history: 7d
          preprocessing:
