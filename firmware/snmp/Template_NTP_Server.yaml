          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.5.7.0
          key: meridian.nts.rx
          delay: 1m
          history: 7d
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
