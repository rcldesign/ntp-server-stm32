# STS1000 "Meridian" — Zabbix template (spec §5.3).
#
# SPDX-License-Identifier: Apache-2.0
#
# Zabbix 6.0 LTS export format. Import with
#   Data collection -> Templates -> Import
# and link it to a host whose SNMP interface is configured for SNMPv3 (spec §9.5
# makes v3 the primary interface; v2c answers only when `sec.snmp.v2c` is 1).
#
# ---------------------------------------------------------------------------
# THE ENTERPRISE ARC IS A PLACEHOLDER
# ---------------------------------------------------------------------------
#
# Every enterprise OID below is 1.3.6.1.4.1.**99999**.1.*, matching SNMP_PEN in
# firmware/app/src/core/snmp/snmp.h. 99999 is NOT an IANA-assigned Private
# Enterprise Number. When a real PEN is allocated, change it in snmp.h and
# search-and-replace `1.3.6.1.4.1.99999` here — the two must always agree, and
# the SNMPv3 engine id derives its enterprise field from the same constant.
#
# ---------------------------------------------------------------------------
# HOST MACROS TO SET ON THE HOST OR TEMPLATE
# ---------------------------------------------------------------------------
#
#   {$SNMP_V3_USER}      USM user name          (cfg sec.snmpv3.u1.name)
#   {$SNMP_V3_AUTHPASS}  auth passphrase        (cfg sec.snmpv3.u1.akey)
#   {$SNMP_V3_PRIVPASS}  privacy passphrase     (cfg sec.snmpv3.u1.pkey)
#
# Zabbix's SNMP interface fields carry the protocols; set them to
# SHA256 / AES128 to match the firmware defaults
# (sec.snmpv3.u1.auth = 2 -> usmHMAC192SHA256AuthProtocol,
#  sec.snmpv3.u1.priv = 1 -> usmAesCfb128Protocol).
#
# ---------------------------------------------------------------------------
# WHAT IS AND IS NOT POPULATED TODAY
# ---------------------------------------------------------------------------
#
# The timing, GNSS, time-service, PTP and health scalars resolve. The rail table
# and the enclosure/die/humidity/fan/PoE/supercap scalars are exposed by the MIB
# but currently answer noSuchInstance, because the SNMP glue cannot reach the
# platform area's health snapshot yet (see the TODO(cross-area telemetry) note in
# src/zephyr/net/sts_snmp.c). Their items are included anyway, and Zabbix will
# simply report them unsupported until that accessor lands — which is more useful
# than discovering later that half the power MIB was never templated.

zabbix_export:
  version: '6.0'
  date: '2026-07-27T00:00:00Z'
  groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates/Network devices
  templates:
    - uuid: 4f2a1c9d5e6b47c8b1a2d3e4f5a60701
      template: 'STS1000 Meridian NTP Server by SNMP'
      name: 'STS1000 Meridian NTP Server by SNMP'
      description: |
        GPS-disciplined Stratum-1 NTP/NTS/PTP grandmaster (STS1000 "Meridian").

        Requires SNMPv3 (USM, HMAC-SHA-256 auth + AES-128 privacy).
        Enterprise arc 1.3.6.1.4.1.99999 is a placeholder PEN — see the header
        comment in this file.
      groups:
        - name: Templates/Network devices
      macros:
        - macro: '{$SNMP_V3_USER}'
          value: meridian
          description: 'USM user name (cfg sec.snmpv3.u1.name)'
        - macro: '{$SNMP_V3_AUTHPASS}'
          value: ''
          type: SECRET_TEXT
          description: 'USM authentication passphrase'
        - macro: '{$SNMP_V3_PRIVPASS}'
          value: ''
          type: SECRET_TEXT
          description: 'USM privacy passphrase'
        - macro: '{$MERIDIAN.HOLDOVER.MAX}'
          value: '3600'
          description: 'Holdover seconds before the trigger fires'
        - macro: '{$MERIDIAN.TIMEERR.MAX}'
          value: '1000000'
          description: 'Estimated time error (ns) before the trigger fires'
        - macro: '{$MERIDIAN.PPS.SIGMA.MAX}'
          value: '500'
          description: 'PPS jitter sigma (ns) before the trigger fires'
        - macro: '{$MERIDIAN.SV.MIN}'
          value: '4'
          description: 'Satellites in use below which the trigger fires'
        - macro: '{$MERIDIAN.TEMP.WARN}'
          value: '70'
          description: 'Enclosure temperature (degC) warning threshold'
        - macro: '{$MERIDIAN.TEMP.CRIT}'
          value: '80'
          description: 'Enclosure temperature (degC) high threshold'
        - macro: '{$MERIDIAN.FAN.RPM.MIN}'
          value: '500'
          description: 'Fan RPM below which the fan is considered stalled'
        - macro: '{$MERIDIAN.POE.DRAW.MAX}'
          value: '25500'
          description: 'PoE draw (mW) above which the trigger fires'

      items:
        # ---- system group ------------------------------------------------
        - uuid: a1000000000000000000000000000001
          name: 'System description'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: system.descr
          delay: 1h
          history: 7d
          trends: '0'
          value_type: CHAR
          inventory_link: MODEL
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: a1000000000000000000000000000002
          name: 'System name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: system.name
          delay: 1h
          history: 7d
          trends: '0'
          value_type: CHAR
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: a1000000000000000000000000000003
          name: 'Uptime'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: system.uptime
          delay: 1m
          history: 7d
          units: uptime
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
        - uuid: a1000000000000000000000000000004
          name: 'Firmware version'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.7.2.0
          key: meridian.fw.version
          delay: 1h
          history: 7d
          trends: '0'
          value_type: CHAR
          inventory_link: SOFTWARE
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
        - uuid: a1000000000000000000000000000005
          name: 'Serial number'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.7.9.0
          key: meridian.serial
          delay: 1h
          history: 7d
          trends: '0'
          value_type: CHAR
          inventory_link: SERIALNO_A
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system

        # ---- timing (enterprise .1.1) -----------------------------------
        - uuid: a1000000000000000000000000000010
          name: 'Timing: NTP stratum'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.1.1.0
          key: meridian.stratum
          delay: 1m
          history: 31d
          tags:
            - tag: component
              value: timing
        - uuid: a1000000000000000000000000000011
          name: 'Timing: lock state'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.1.2.0
          key: meridian.lock.state
          delay: 30s
          history: 31d
          description: '0 = unlocked, 1 = acquiring, 2 = locked, 3 = holdover'
          valuemap:
            name: 'Lock state'
          tags:
            - tag: component
              value: timing
        - uuid: a1000000000000000000000000000012
          name: 'Timing: active reference'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.1.3.0
          key: meridian.active.ref
          delay: 1m
          history: 31d
          description: '0 = OCXO, 1 = external rubidium'
          valuemap:
            name: 'Active reference'
          tags:
            - tag: component
              value: timing
        - uuid: a1000000000000000000000000000013
          name: 'Timing: in holdover'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.1.4.0
          key: meridian.holdover
          delay: 30s
          history: 31d
          valuemap:
            name: 'Boolean'
          tags:
            - tag: component
              value: timing
        - uuid: a1000000000000000000000000000014
          name: 'Timing: estimated time error'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.1.5.0
          key: meridian.holdover.err
          delay: 1m
          history: 31d
