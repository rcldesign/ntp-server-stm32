          snmp_oid: 1.3.6.1.4.1.99999.1.6.5.0
          key: meridian.ptp.tx
          delay: 1m
          history: 7d
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: ptp
        - uuid: a1000000000000000000000000000075
          name: 'PTP: messages received'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.6.6.0
          key: meridian.ptp.rx
          delay: 1m
          history: 7d
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: ptp
        - uuid: a1000000000000000000000000000076
          name: 'PTP: announce timeouts'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.6.7.0
          key: meridian.ptp.anntimeouts
          delay: 5m
          history: 7d
          preprocessing:
            - type: SIMPLE_CHANGE
              parameters:
                - ''
          tags:
            - tag: component
              value: ptp
        - uuid: a1000000000000000000000000000077
          name: 'PTP: alarm bitmask'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.6.8.0
          key: meridian.ptp.alarms
          delay: 1m
          history: 31d
          tags:
            - tag: component
              value: ptp

        # ---- health / power (enterprise .1.7) ---------------------------
        - uuid: a1000000000000000000000000000080
          name: 'Health: alarm bitmask'
          type: SNMP_AGENT
