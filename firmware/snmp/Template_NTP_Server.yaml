      discovery_rules:
        # ---- the nine INA228 rails (enterprise .1.3.1.1) ----------------
        - uuid: b1000000000000000000000000000001
          name: 'Power rail discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#RAIL.NAME},1.3.6.1.4.1.99999.1.3.1.1.2]'
          key: meridian.rail.discovery
          delay: 1h
          description: |
            Walks the rail-name column of the nine-row INA228 table
            (interface ref §4.2). Until the SNMP glue can reach the platform
            area's health snapshot these columns answer noSuchInstance and the
            rule discovers nothing — see the header comment in this file.
          item_prototypes:
            - uuid: c1000000000000000000000000000001
              name: 'Rail {#RAIL.NAME}: voltage'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.99999.1.3.1.1.3.{#SNMPINDEX}'
              key: 'meridian.rail.mv[{#SNMPINDEX}]'
              delay: 1m
              history: 31d
              value_type: FLOAT
              units: V
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              tags:
                - tag: component
                  value: power
                - tag: rail
                  value: '{#RAIL.NAME}'
            - uuid: c1000000000000000000000000000002
              name: 'Rail {#RAIL.NAME}: current'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.99999.1.3.1.1.4.{#SNMPINDEX}'
              key: 'meridian.rail.ua[{#SNMPINDEX}]'
              delay: 1m
              history: 31d
              value_type: FLOAT
              units: A
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.000001'
              tags:
                - tag: component
                  value: power
                - tag: rail
                  value: '{#RAIL.NAME}'
            - uuid: c1000000000000000000000000000003
              name: 'Rail {#RAIL.NAME}: power'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.99999.1.3.1.1.5.{#SNMPINDEX}'
              key: 'meridian.rail.mw[{#SNMPINDEX}]'
              delay: 1m
              history: 31d
              value_type: FLOAT
              units: W
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              tags:
                - tag: component
                  value: power
                - tag: rail
                  value: '{#RAIL.NAME}'
          graph_prototypes:
            - uuid: d1000000000000000000000000000001
              name: 'Rail {#RAIL.NAME}: voltage and current'
              graph_items:
                - color: 1A7C11
                  item:
                    host: 'STS1000 Meridian NTP Server by SNMP'
                    key: 'meridian.rail.mv[{#SNMPINDEX}]'
                - sortorder: '1'
                  color: 2774A4
                  yaxisside: RIGHT
                  item:
                    host: 'STS1000 Meridian NTP Server by SNMP'
                    key: 'meridian.rail.ua[{#SNMPINDEX}]'

      triggers:
        - uuid: e1000000000000000000000000000001
          expression: 'last(/STS1000 Meridian NTP Server by SNMP/meridian.lock.state)<>2'
          name: 'Meridian: timing reference not locked'
          priority: HIGH
          description: |
            The discipline loop is not locked, so the served time is either
            converging or flywheeling. Check GNSS fix and satellite count first.
          tags:
            - tag: scope
              value: availability
        - uuid: e1000000000000000000000000000002
          expression: 'last(/STS1000 Meridian NTP Server by SNMP/meridian.holdover)=1'
          name: 'Meridian: in holdover'
          priority: WARNING
          description: 'The reference is lost and the oscillator is flywheeling.'
          dependencies:
            - name: 'Meridian: timing reference not locked'
              expression: 'last(/STS1000 Meridian NTP Server by SNMP/meridian.lock.state)<>2'
          tags:
            - tag: scope
              value: availability
        - uuid: e1000000000000000000000000000003
          expression: |
            min(/STS1000 Meridian NTP Server by SNMP/meridian.holdover.elapsed,5m)>{$MERIDIAN.HOLDOVER.MAX}
          name: 'Meridian: holdover longer than {$MERIDIAN.HOLDOVER.MAX}s'
          priority: HIGH
          description: 'Prolonged holdover; the stratum will be demoted when the error estimate exceeds the configured limit.'
          tags:
            - tag: scope
              value: availability
        - uuid: e1000000000000000000000000000004
          expression: |
            min(/STS1000 Meridian NTP Server by SNMP/meridian.holdover.err,5m)>{$MERIDIAN.TIMEERR.MAX}
          name: 'Meridian: estimated time error above {$MERIDIAN.TIMEERR.MAX}ns'
          priority: HIGH
          tags:
            - tag: scope
              value: performance
        - uuid: e1000000000000000000000000000005
          expression: 'last(/STS1000 Meridian NTP Server by SNMP/meridian.stratum)>1'
          name: 'Meridian: no longer advertising stratum 1'
          priority: AVERAGE
          tags:
            - tag: scope
              value: availability
        - uuid: e1000000000000000000000000000006
          expression: |
            min(/STS1000 Meridian NTP Server by SNMP/meridian.pps.sigma,10m)>{$MERIDIAN.PPS.SIGMA.MAX}
          name: 'Meridian: PPS jitter above {$MERIDIAN.PPS.SIGMA.MAX}ns'
          priority: WARNING
          description: 'Sustained PPS jitter — check antenna placement, cable and multipath.'
          tags:
            - tag: scope
              value: performance
        - uuid: e1000000000000000000000000000007
          expression: 'last(/STS1000 Meridian NTP Server by SNMP/meridian.gnss.ant.state)<>1'
          name: 'Meridian: GNSS antenna fault'
          priority: HIGH
          description: 'The antenna supervisor reports open or short. Bias may have been dropped to protect the limiter.'
          tags:
            - tag: scope
              value: availability
        - uuid: e1000000000000000000000000000008
          expression: |
            max(/STS1000 Meridian NTP Server by SNMP/meridian.gnss.sv.used,10m)<{$MERIDIAN.SV.MIN}
          name: 'Meridian: fewer than {$MERIDIAN.SV.MIN} satellites in use'
          priority: AVERAGE
          dependencies:
            - name: 'Meridian: GNSS antenna fault'
              expression: 'last(/STS1000 Meridian NTP Server by SNMP/meridian.gnss.ant.state)<>1'
          tags:
            - tag: scope
              value: availability
        - uuid: e1000000000000000000000000000009
          expression: 'last(/STS1000 Meridian NTP Server by SNMP/meridian.gnss.leap.pending)<>0'
          name: 'Meridian: leap second pending'
          priority: INFO
          description: 'A leap second is announced. Informational — the server handles it, but correlate any step here.'
          tags:
            - tag: scope
              value: notice
        - uuid: e1000000000000000000000000000010
          expression: 'last(/STS1000 Meridian NTP Server by SNMP/meridian.alarms)<>0'
          name: 'Meridian: one or more hardware alarms active'
          priority: AVERAGE
          description: 'Read the alarm bitmask, or the device log, for the specific fault.'
          tags:
            - tag: scope
              value: availability
        - uuid: e1000000000000000000000000000011
          expression: |
            min(/STS1000 Meridian NTP Server by SNMP/meridian.temp.enclosure,5m)>{$MERIDIAN.TEMP.CRIT}
          name: 'Meridian: enclosure temperature above {$MERIDIAN.TEMP.CRIT}C'
          priority: HIGH
          description: 'The over-temperature ladder will shed the rubidium and then cold-cycle the board.'
          tags:
            - tag: scope
              value: temperature
        - uuid: e1000000000000000000000000000012
          expression: |
            min(/STS1000 Meridian NTP Server by SNMP/meridian.temp.enclosure,5m)>{$MERIDIAN.TEMP.WARN}
          name: 'Meridian: enclosure temperature above {$MERIDIAN.TEMP.WARN}C'
          priority: WARNING
          dependencies:
            - name: 'Meridian: enclosure temperature above {$MERIDIAN.TEMP.CRIT}C'
              expression: |
                min(/STS1000 Meridian NTP Server by SNMP/meridian.temp.enclosure,5m)>{$MERIDIAN.TEMP.CRIT}
          tags:
            - tag: scope
              value: temperature
        - uuid: e1000000000000000000000000000013
          expression: |
            max(/STS1000 Meridian NTP Server by SNMP/meridian.fan.rpm,5m)<{$MERIDIAN.FAN.RPM.MIN}
            and last(/STS1000 Meridian NTP Server by SNMP/meridian.fan.duty)>0
          name: 'Meridian: fan stalled'
          priority: AVERAGE
          description: 'A duty cycle is commanded but the tachometer reports no rotation.'
          tags:
            - tag: scope
              value: temperature
        - uuid: e1000000000000000000000000000014
          expression: |
            min(/STS1000 Meridian NTP Server by SNMP/meridian.poe.draw,5m)>{$MERIDIAN.POE.DRAW.MAX}
          name: 'Meridian: PoE draw above the configured budget'
          priority: WARNING
          description: 'Sustained draw over the negotiated budget; the PSE may disconnect the port.'
          tags:
            - tag: scope
              value: power
        - uuid: e1000000000000000000000000000015
          expression: |
            change(/STS1000 Meridian NTP Server by SNMP/meridian.ntp.authfail)>0
          name: 'Meridian: NTP authentication failures'
          priority: WARNING
          description: 'Symmetric-key or NTS authentication is failing — a key mismatch, or someone probing.'
          tags:
            - tag: scope
              value: security
        - uuid: e1000000000000000000000000000016
          expression: |
            last(/STS1000 Meridian NTP Server by SNMP/meridian.ptp.state)<>6
            and last(/STS1000 Meridian NTP Server by SNMP/meridian.ptp.state)<>0
          name: 'Meridian: PTP port not MASTER'
          priority: AVERAGE
          description: 'The grandmaster is not serving PTP. State 0 means PTP is disabled, which is not an alarm.'
          tags:
            - tag: scope
              value: availability
        - uuid: e1000000000000000000000000000017
          expression: 'last(/STS1000 Meridian NTP Server by SNMP/meridian.ptp.class)>7'
          name: 'Meridian: PTP clock class degraded'
          priority: AVERAGE
          description: 'clockClass above 7 means the grandmaster no longer claims traceability to a primary reference.'
          tags:
            - tag: scope
              value: performance
        - uuid: e1000000000000000000000000000018
          expression: |
            last(/STS1000 Meridian NTP Server by SNMP/system.uptime)<10m
          name: 'Meridian: device has restarted'
          priority: INFO
          description: 'Correlate with a coldStart trap and with the PoE/watchdog history.'
          manual_close: 'YES'
          tags:
            - tag: scope
              value: notice

      valuemaps:
        - uuid: f1000000000000000000000000000001
          name: 'Boolean'
          mappings:
            - value: '0'
              newvalue: 'No'
            - value: '1'
              newvalue: 'Yes'
        - uuid: f1000000000000000000000000000002
          name: 'Lock state'
          mappings:
            - value: '0'
              newvalue: Unlocked
            - value: '1'
              newvalue: Acquiring
            - value: '2'
              newvalue: Locked
            - value: '3'
              newvalue: Holdover
        - uuid: f1000000000000000000000000000003
          name: 'Active reference'
          mappings:
            - value: '0'
              newvalue: 'OCXO (internal)'
            - value: '1'
              newvalue: 'Rubidium (external)'
        - uuid: f1000000000000000000000000000004
          name: 'GNSS fix'
          mappings:
            - value: '0'
              newvalue: 'No fix'
            - value: '1'
              newvalue: 'Dead reckoning'
            - value: '2'
              newvalue: '2D fix'
            - value: '3'
              newvalue: '3D fix'
            - value: '4'
              newvalue: 'GNSS + dead reckoning'
            - value: '5'
              newvalue: 'Time only'
        - uuid: f1000000000000000000000000000005
          name: 'Antenna state'
          mappings:
            - value: '0'
              newvalue: Unknown
            - value: '1'
              newvalue: OK
            - value: '2'
              newvalue: Open
            - value: '3'
              newvalue: Short
        - uuid: f1000000000000000000000000000006
          name: 'PTP port state'
          mappings:
            - value: '0'
              newvalue: Disabled
            - value: '1'
              newvalue: Initializing
            - value: '2'
              newvalue: Faulty
            - value: '3'
              newvalue: Listening
            - value: '4'
              newvalue: 'Pre-master'
            - value: '5'
              newvalue: Passive
            - value: '6'
              newvalue: Master
            - value: '7'
              newvalue: Uncalibrated
            - value: '8'
              newvalue: Slave

