            - tag: component
              value: gnss
        - uuid: a1000000000000000000000000000036
          name: 'GNSS: current leap seconds'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.2.7.0
          key: meridian.gnss.leap.current
          delay: 1h
          history: 31d
          units: s
          tags:
            - tag: component
              value: gnss

        # ---- thermal / environment (enterprise .1.4) ---------------------
        - uuid: a1000000000000000000000000000040
          name: 'Environment: enclosure temperature'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.4.1.0
          key: meridian.temp.enclosure
          delay: 1m
          history: 31d
          value_type: FLOAT
          units: °C
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.001'
          tags:
            - tag: component
              value: environment
        - uuid: a1000000000000000000000000000041
          name: 'Environment: MCU die temperature'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.4.3.0
          key: meridian.temp.die
          delay: 1m
          history: 31d
          value_type: FLOAT
          units: °C
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.001'
          tags:
            - tag: component
              value: environment
        - uuid: a1000000000000000000000000000042
          name: 'Environment: relative humidity'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.4.4.0
          key: meridian.humidity
          delay: 5m
          history: 31d
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: MULTIPLIER
