              value: ntp
        - uuid: a1000000000000000000000000000053
          name: 'NTP: kiss-o-death sent'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.5.4.0
          key: meridian.ntp.kod
          delay: 1m
          history: 7d
          preprocessing:
