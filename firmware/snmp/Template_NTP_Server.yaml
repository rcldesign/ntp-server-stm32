        - uuid: a1000000000000000000000000000035
          name: 'GNSS: leap second pending'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.99999.1.2.6.0
          key: meridian.gnss.leap.pending
          delay: 5m
          history: 31d
